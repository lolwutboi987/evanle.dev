<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase — Evan Le</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <style>
        .loading {
            padding: 4rem;
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">evanle.dev</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="showcase.html" class="active">Showcase</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><button id="theme-toggle" aria-label="Toggle theme">Theme</button></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="container">
                <p class="subtitle">Showcase</p>
                <h1>Selected Projects</h1>
                <p class="hero-text">A dynamic collection of tools, libraries, and experiments sourced directly from GitHub.</p>
            </div>
        </section>

        <section class="gallery-content">
            <div class="container">
                <div id="github-repos" class="gallery-grid">
                    <div class="loading">Fetching repositories...</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Evan Le</p>
            <div class="social-links">
                <a href="https://github.com/lolwutboi987" target="_blank" rel="noopener noreferrer">GitHub</a>
            </div>
        </div>
    </footer>

    <script>
        async function fetchRepos() {
            const container = document.getElementById('github-repos');
            const username = 'lolwutboi987';

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=12`);
                if (!response.ok) throw new Error('Failed to fetch');

                const repos = await response.json();
                container.innerHTML = '';

                // Prepend Energy Map Project
                const mapCard = document.createElement('div');
                mapCard.className = 'gallery-item';
                mapCard.innerHTML = `
                    <div class="gallery-image">
                        <div style="width: 100%; height: 100%; background: var(--light-bg); display: flex; align-items: center; justify-content: center; font-size: 3rem;">🗺️</div>
                    </div>
                    <div class="gallery-info">
                        <h3>Interactive Energy Map</h3>
                        <p>A live subdomain project visualizing U.S. power and natural gas consumption per capita using EIA and Census data.</p>
                        <a href="energy-map.html" class="project-link">Launch Live Map →</a>
                    </div>
                `;
                container.appendChild(mapCard);

                repos.forEach(repo => {
                    if (repo.fork) return;

                    const card = document.createElement('div');
                    card.className = 'gallery-item';

                    const imageUrl = `https://opengraph.githubassets.com/1/${username}/${repo.name}`;

                    card.innerHTML = `
                        <div class="gallery-image">
                            <img src="${imageUrl}" alt="${repo.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-size: 2rem; color: var(--border-color)\'>📂</div>'">
                        </div>
                        <div class="gallery-info">
                            <h3>${repo.name}</h3>
                            <p>${repo.description || 'No description available for this project.'}</p>
                            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="project-link">Source Code →</a>
                        </div>
                    `;
                    container.appendChild(card);
                });

                if (container.children.length === 0) {
                    container.innerHTML = '<div class="loading">No public repositories found.</div>';
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="loading">Failed to load repositories. Please check back later.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', fetchRepos);
    </script>
</body>
</html>
